<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Juggle Jumps</title>
<meta name="description" content="Juggling practice game: every juggle jumps your horse over a fence.">
<meta name="theme-color" content="#2f6b3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3efe4; --panel:#fffdf7; --ink:#2b2a26; --muted:#6c675c; --line:#e2dccb;
  --green:#2f8a3e; --green-d:#1f6a2c; --red:#d8432f; --red-d:#a92f1f; --gold:#f2b632; --gold-d:#c98b0b;
  --sky:#8fd0f2; --navy:#22305a; --lock:#b9b2a1;
  --head:"Baloo 2",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#17191c; --panel:#22252a; --ink:#f1ede3; --muted:#a8a294; --line:#363a41; --lock:#5c5a55; }
}
:root[data-theme="dark"]{ --bg:#17191c; --panel:#22252a; --ink:#f1ede3; --muted:#a8a294; --line:#363a41; --lock:#5c5a55; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 17px/1.4 var(--body)}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.1}
[hidden]{display:none!important}
.screen{min-height:100dvh}

/* ---------- home ---------- */
#home{max-width:560px;margin:0 auto;padding:12px 16px 40px}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.top h1{font-size:34px;font-weight:800;letter-spacing:.3px;flex:1}
.top h1 span{color:var(--green)}
.iconbtn{border:0;background:var(--panel);border:2px solid var(--line);border-radius:14px;min-width:46px;height:46px;font-size:22px;display:grid;place-items:center;cursor:pointer}
.hero{position:relative;border-radius:var(--r);overflow:hidden;background:var(--sky);height:150px;border:2px solid var(--line)}
.hero canvas{width:100%;height:100%;display:block}
.goal{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.goal .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.goal b.big{font:800 34px var(--head);color:var(--green)}
.bar{height:14px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:99px;transition:width .4s}
.small{font-size:15px;color:var(--muted)}
#chart{width:100%;height:120px;display:block;margin-top:8px}
.playbig{width:100%;border:0;border-radius:var(--r);background:var(--green);color:#fff;font:800 24px var(--head);padding:16px;box-shadow:0 5px 0 var(--green-d);cursor:pointer;margin:6px 0 16px}
.playbig small{display:block;font:700 15px var(--body);opacity:.9}
.world{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);margin:0 0 12px;overflow:hidden}
.world.locked{opacity:.6}
.whead{display:flex;align-items:center;gap:12px;padding:12px 14px;color:#fff}
.whead .wi{font-size:30px}
.whead h2{font-size:23px}
.whead p{margin:0;font-size:15px;opacity:.95}
.course{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:2px solid var(--line)}
.course .cn{flex:1;min-width:0}
.course .cn b{display:block}
.course .cn span{font-size:15px;color:var(--muted)}
.nodes{display:flex;gap:7px}
.node{width:44px;height:44px;border-radius:50%;border:3px solid var(--lock);background:var(--panel);font:800 15px var(--head);display:grid;place-items:center;cursor:pointer;color:var(--muted);padding:0}
.node.open{border-color:var(--gold-d);background:var(--gold);color:#3b2a00;box-shadow:0 3px 0 var(--gold-d)}
.node.done{border-color:var(--green-d);background:var(--green);color:#fff}
.node:disabled{cursor:default}

/* ---------- play ---------- */
#play{height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.pbar{display:flex;align-items:center;gap:8px;padding:8px 10px 4px}
.pbar .lbl{flex:1;min-width:0;font:800 17px var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .lbl small{display:block;font:700 14px var(--body);color:var(--muted)}
.hud{display:flex;align-items:center;gap:12px;padding:2px 14px 6px}
.count{font:800 54px/1 var(--head);color:var(--green);min-width:0}
.count small{font-size:24px;color:var(--muted)}
.count.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.15)}}
.shoes{display:flex;gap:2px;font-size:24px;margin-left:auto;align-items:center}
.shoes .lost{filter:grayscale(1);opacity:.25}
.shoes .zero{font:800 15px var(--body);color:var(--red);text-align:right;line-height:1.1}
.stage{position:relative;flex:1;min-height:0;margin:0 10px;border-radius:var(--r);overflow:hidden;border:2px solid var(--line);background:var(--sky)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.progress{position:absolute;left:10px;right:10px;top:8px;height:12px;border-radius:99px;background:rgba(255,255,255,.55);overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);transition:width .25s}
.cam{position:absolute;right:8px;top:28px;width:31%;max-width:180px;aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:3px solid #fff;background:#000;box-shadow:0 3px 10px rgba(0,0,0,.3);cursor:pointer}
.cam.big{inset:0;width:auto;max-width:none;aspect-ratio:auto;border:0;border-radius:0;z-index:4}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .mirror{transform:scaleX(-1)}
.cam .tag{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font:700 13px var(--body);padding:3px 6px;text-align:center}
.cam.big .tag{font-size:16px;padding:8px}
.tip{padding:6px 14px 2px;font-size:16px;color:var(--muted);text-align:center;min-height:28px}
.ctrl{display:flex;gap:10px;padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
.big{flex:1;border:0;border-radius:var(--r);font:800 26px var(--head);color:#fff;height:92px;cursor:pointer;touch-action:manipulation;user-select:none}
.big:active{transform:translateY(3px);box-shadow:none!important}
.big.j{background:var(--green);box-shadow:0 5px 0 var(--green-d);flex:1.6}
.big.d{background:var(--red);box-shadow:0 5px 0 var(--red-d)}
.mini{flex:1;border:2px solid var(--line);background:var(--panel);border-radius:14px;height:54px;font:800 17px var(--body);cursor:pointer}
.ctrl.cam-ctrl .mini.d{border-color:var(--red);color:var(--red)}
.status{font-size:14px;color:var(--muted);text-align:center;padding:0 10px}
.undo{border:0;background:none;color:var(--muted);font:700 15px var(--body);text-decoration:underline;padding:4px 8px;cursor:pointer}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;background:rgba(15,20,25,.6);display:grid;place-items:center;z-index:20;padding:16px}
.card{background:var(--panel);border-radius:22px;padding:18px;width:100%;max-width:420px;text-align:center;max-height:92dvh;overflow:auto}
.card h2{font-size:32px;font-weight:800}
.card p{margin:8px 0}
.card .stats{display:flex;gap:8px;justify-content:center;margin:12px 0}
.card .stats div{flex:1;background:var(--bg);border-radius:12px;padding:8px}
.card .stats b{display:block;font:800 26px var(--head)}
.card .stats span{font-size:14px;color:var(--muted)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font:800 20px var(--head);cursor:pointer;margin-top:10px;background:var(--line);color:var(--ink)}
.btn.go{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d)}
.btn.gold{background:var(--gold);color:#3b2a00;box-shadow:0 4px 0 var(--gold-d)}
.rosette{font-size:70px;line-height:1}
.setup-cam{position:relative;width:100%;aspect-ratio:3/4;max-height:52dvh;border-radius:14px;overflow:hidden;background:#000;margin:10px 0}
.setup-cam video,.setup-cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.checks{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-weight:800}
.checks span{padding:6px 10px;border-radius:99px;background:var(--bg)}
.checks span.ok{background:var(--green);color:#fff}
.countdown{position:fixed;inset:0;display:grid;place-items:center;z-index:30;pointer-events:none;font:800 160px var(--head);color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.35)}

/* ---------- settings ---------- */
.sheet{text-align:left}
.sheet h2{text-align:center;margin-bottom:6px}
.field{padding:12px 0;border-bottom:2px solid var(--line)}
.field>b{display:block;margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:80px;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 6px;font-weight:800;cursor:pointer}
.seg button.on{border-color:var(--green);background:var(--green);color:#fff}
.field input[type=text],.field input[type=email]{width:100%;font:inherit;font-size:17px;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.field input[type=range]{width:100%}
.sw{display:flex;align-items:center;gap:10px;font-weight:700;padding:4px 0;cursor:pointer}
.sw input{width:24px;height:24px;accent-color:var(--green)}
.danger{color:var(--red);background:none;border:2px solid var(--red)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:40;max-width:90vw;text-align:center}
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<section id="home" class="screen">
  <div class="top">
    <h1>Juggle <span>Jumps</span></h1>
    <button class="iconbtn" id="openSettings" aria-label="Settings">⚙️</button>
  </div>
  <div class="hero"><canvas id="heroCv" aria-hidden="true"></canvas></div>

  <button class="playbig" id="continueBtn">Play<small id="continueSub">Home Barn · Bounce juggles · Level 1</small></button>

  <div class="goal">
    <div class="row"><span><b>Road to 100</b> <span class="small">in a row</span></span><b class="big" id="bestNum">0</b></div>
    <div class="bar"><i id="bestBar" style="width:0%"></i></div>
    <div class="row small"><span id="bestNote">Best in a row so far</span><span id="daysLeft"></span></div>
    <svg id="chart" role="img" aria-label="Best juggles in a row by day"></svg>
  </div>

  <div id="worlds"></div>
  <p class="small" style="text-align:center">Clear all four courses in a world to open the next one. <span id="testNote" hidden><b>Test mode is on:</b> 3 juggles per level.</span></p>
</section>

<!-- ============ PLAY ============ -->
<section id="play" class="screen" hidden>
  <div class="pbar">
    <button class="iconbtn" id="quitBtn" aria-label="Back to map">✕</button>
    <div class="lbl"><span id="pTitle">Feet only · Level 1</span><small id="pSub">Home Barn · 3 drops allowed</small></div>
    <button class="iconbtn" id="muteBtn" aria-label="Sound on or off">🔊</button>
  </div>
  <div class="hud">
    <div class="count" id="count">0<small> / 15</small></div>
    <div class="shoes" id="shoes" aria-label="Drops left"></div>
  </div>
  <div class="stage" id="stage">
    <canvas id="scene" aria-label="Horse jumping game"></canvas>
    <div class="progress"><i id="prog" style="width:0%"></i></div>
    <div class="cam" id="camBox" hidden>
      <video id="camVideo" playsinline muted></video>
      <canvas id="camDbg"></canvas>
      <div class="tag" id="camTag">Starting camera…</div>
    </div>
  </div>
  <div class="tip" id="tip">Laces, toes up, ankle locked.</div>
  <div class="ctrl" id="tapCtrl">
    <button class="big d" id="dropBtn">Drop</button>
    <button class="big j" id="jugBtn">Juggle!</button>
  </div>
  <div class="ctrl cam-ctrl" id="camCtrl" hidden>
    <button class="mini" id="minusBtn">−1</button>
    <button class="mini" id="plusBtn">+1 missed</button>
    <button class="mini d" id="camDropBtn">Drop</button>
  </div>
  <div class="status"><button class="undo" id="undoBtn">Undo last</button> <span id="statusTxt"></span></div>
</section>

<!-- ============ OVERLAYS ============ -->
<div class="ov" id="ov" hidden><div class="card" id="ovCard"></div></div>
<div class="countdown" id="cd" hidden></div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
